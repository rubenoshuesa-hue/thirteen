<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guerra Civil Americana - Menú Principal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            overflow: hidden;
            background-color: #1a0f0a;
        }

        /* Pantalla de carga */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0f0a 0%, #3d2817 50%, #1a0f0a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease;
        }

        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-title {
            font-size: 3em;
            color: #d4a574;
            text-shadow: 3px 3px 6px #000, 0 0 20px #d4a574;
            margin-bottom: 40px;
            letter-spacing: 4px;
            text-align: center;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 3px 3px 6px #000, 0 0 20px #d4a574; }
            to { text-shadow: 3px 3px 6px #000, 0 0 40px #f4c89a, 0 0 60px #d4a574; }
        }

        .loading-bar-container {
            width: 60%;
            max-width: 600px;
            height: 30px;
            background-color: #2a1a0f;
            border: 3px solid #8b6914;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(139, 105, 20, 0.5);
        }

        .loading-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #8b6914, #d4a574, #f4c89a);
            border-radius: 12px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px #d4a574;
        }

        .loading-text {
            color: #d4a574;
            margin-top: 20px;
            font-size: 1.2em;
            letter-spacing: 2px;
        }

        .loading-percentage {
            color: #f4c89a;
            margin-top: 10px;
            font-size: 1.5em;
            font-weight: bold;
        }

        /* Main Menu */
        #mainMenu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://content-historia.nationalgeographic.com.es/medio/2017/07/03/37673_04658188.jpg');
            background-size: cover;
            background-position: center;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 500;
        }
    /*menu Buttons*/
    .menu-buttons{
    display: flex;
    flex-direction: column;
    gap: 25px;
    z-index: 1;
    }

    .menu-btn{
    padding: 18px 80px;
    font-size: 1.4em;
    font-family: 'Georgia', sherif;
    letter-spacing: 3px;
    color: #d4a574;
    background: linear-gradient(180deg, #3d2817 0%, #2a1a0f 100%);
    border: 3px solid #8b6914;
    border-radius: 8px;
    cursor:pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
    mini-width: 320px;
    }

    .menu-btn::before {
    content:";
    position:absolute;
    top: 0;
    }

    .menu-btn:hover {
    background: linear-gradient(180deg, #5a3d24 0%, #3d2817 100%);
    color: #f4c89a;
    border-color: # d4a574;
    box-shadow: 0 0 25px rgba(212, 165, 116, 0.6);
    transform: scale(1.05);
    }

    .menu-btn:active{
    transform:scale(0.98);
    }

    #settingsPanel{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 600;
    }

    #settingsPanel.visible{
    display:flexanimation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn{
    from{ opacity: 0;}
    to { opacity: 1;}
    }

    .settings-content {
    background: linear-gradient(135deg, #2a1a0f 0%, #3d2817 100%);
    border: 4px solid #8b6914;
    border-radius: 15px;
    padding: 40px 60px;
    max-width: 700px;
    width: 90%;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 0 50px rgba(139, 105, 20, 0.5);
    }
    </style>


</head>
<body >

</body>
</html>
